# Ръчна проверка с VirusTotal на вече публикувано издание (напр. по-старо
# или ако автоматичната проверка в release.yml е пропусната). Изданията,
# публикувани от GitHub Actions, не задействат други workflow-и, затова
# тази проверка се пуска ръчно: Actions → VirusTotal scan → Run workflow.
# Нужен е secret VT_API_KEY (безплатен ключ от virustotal.com).
name: VirusTotal scan

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Издание за проверка (напр. v3.76.0); празно = най-новото"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag="$TAG_INPUT"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          # Одит (06.10.2026): новите имена; издание до v3.78 ги няма —
          # тогава старите (PachoLogistic*.exe).
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "PHLogistics.exe" --pattern "PHLogistics-Setup.exe" --dir assets \
          || gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "PachoLogistic.exe" --pattern "PachoLogistic-Setup.exe" --dir assets

      - name: VirusTotal scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > release_body.md
          python scripts/virustotal_scan.py --summary vt_summary.md --body-file release_body.md \
            assets/*.exe
          if [ -s vt_summary.md ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release_body.md
          fi
