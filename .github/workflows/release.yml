# Автоматично компилиране на PachoLogistic.exe и публикуване на релийз в GitHub.
# Задейства се при всяка промяна на version.py (т.е. при вдигане на версията).
# Версията е семантична: голяма.средна.малка (напр. 1.2.3).
name: Build and Release

on:
  push:
    branches: ["**"]
    paths:
      - "version.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.version }} already exists - skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.exists.outputs.exists == 'false'
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build PachoLogistic.exe
        if: steps.exists.outputs.exists == 'false'
        run: pyinstaller --onefile --name PachoLogistic --add-data "templates;templates" --add-data "static;static" app.py

      - name: Smoke test the exe
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          ./dist/PachoLogistic.exe > exe_output.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/login | grep -q "PachoLogistic\|Вход"; then
              echo "Exe starts and serves the login page - OK"
              kill $APP_PID || true
              exit 0
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "Exe process exited early. Output:"
              cat exe_output.log
              exit 1
            fi
            sleep 2
          done
          echo "Exe did not start correctly. Output:"
          cat exe_output.log
          kill $APP_PID || true
          exit 1

      - name: Publish release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ПачоЛогистик v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/PachoLogistic.exe
          generate_release_notes: true
          body: |
            ## 🚚 ПачоЛогистик v${{ steps.ver.outputs.version }}

            **Изтегляне:** свалете прикачения файл **PachoLogistic.exe** по-долу и го стартирайте — не изисква инсталация.

            Постоянен линк към най-новата версия:
            https://github.com/${{ github.repository }}/releases/latest/download/PachoLogistic.exe

            При стартиране програмата отваря браузъра на http://127.0.0.1:5000.
            Първи вход: потребител `admin`, парола `admin123` (сменете я веднага).

            Инсталираните копия се обновяват автоматично — програмата сама открива
            новата версия и предлага „Обнови сега“ от таблото.
