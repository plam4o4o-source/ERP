# Автоматично компилиране на PachoLogistic.exe (+ Windows инсталатор) и
# публикуване на релийз в GitHub. Задейства се при всяка промяна на
# version.py (т.е. при вдигане на версията).
# Версията е семантична: голяма.средна.малка (напр. 1.2.3).
name: Build and Release

on:
  push:
    branches: ["**"]
    paths:
      - "version.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # ВАЖНО: 3.12, НЕ последната "стабилна" версия на Python.
          # Билдвахме с 3.14 преди (виж CHANGELOG v1.0.2) и това причини
          # повтарящата се грешка "Failed to load Python DLL ...
          # python314.dll ... LoadLibrary: The specified module could
          # not be found" при стартиране на готовото .exe при служители.
          # Това е известен, все още неразрешен проблем при PyInstaller
          # --onefile билдове с много нови версии на CPython (същият
          # клас грешка е докладван и в други PyInstaller проекти
          # веднага след издаване на нова главна версия на Python —
          # bootloader-ът на PyInstaller изостава в поддръжката).
          # 3.12 е дългогодишно, широко тествано с PyInstaller — при
          # нужда от по-нова версия, изчакай PyInstaller изрично да
          # обяви поддръжка за нея, преди да местиш това число.
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.version }} already exists - skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.exists.outputs.exists == 'false'
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0

      - name: Stamp version into exe metadata
        if: steps.exists.outputs.exists == 'false'
        shell: python
        run: |
          import re
          v = "${{ steps.ver.outputs.version }}"
          parts = (v.split(".") + ["0", "0", "0"])[:3] + ["0"]
          tuple_str = "(%s)" % ", ".join(parts)
          with open("version_info.txt", "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("(0, 0, 0, 0)", tuple_str)
          content = content.replace("0.0.0.0", "%s.%s.%s.%s" % tuple(parts))
          with open("version_info.txt", "w", encoding="utf-8") as f:
              f.write(content)

      - name: Build PachoLogistic.exe
        if: steps.exists.outputs.exists == 'false'
        # --add-data "translations;translations" и --collect-data babel:
        # добавени за многоезичния интерфейс (БГ/EN/TR, Flask-Babel).
        # Без тях компилираният .exe тръгва (Babel/gettext пада тихо
        # обратно към суровия msgid, не хвърля грешка), но превключвателят
        # на езика в него не прави нищо — .mo каталозите ни (собствения
        # translations/ пакет) ги нямаше в комплекта, а --collect-data
        # babel е нужен за собствените CLDR данни на Babel пакета (те се
        # зареждат динамично, не през нормален import, затова PyInstaller
        # не ги хваща автоматично без изричен флаг — известен gotcha).
        # --add-data "fonts;fonts": DejaVu Sans шрифтовете за PDF износа
        # (pdf_export.py, бутон „Изтегли PDF“) — вижте fonts/README.md.
        # Без тях компилираният .exe пак генерира PDF (xhtml2pdf не гърми
        # при липсващ @font-face файл), но кирилицата в него излиза като
        # плътни черни правоъгълници вместо букви — същият клас "тихо
        # проваля се без грешка" проблем като Babel по-горе.
        #
        # --collect-submodules reportlab.graphics.barcode: ЗАДЪЛЖИТЕЛЕН за
        # PDF износа. reportlab зарежда баркод модулите си ДИНАМИЧНО, през
        # exec на сглобен низ (reportlab/graphics/barcode/widgets.py:
        # `code = 'from %s import %s' % (mod, codeName); rl_exec(code, ns)`),
        # затова статичният анализ на PyInstaller не ги вижда и не ги
        # пакетира. Веригата, по която ни засяга: pdf_export → xhtml2pdf.pisa
        # → …tags → reportlab.graphics.barcode.__init__._reset() → widgets.
        # Тъй като това се случва при ИМПОРТА, компилираният .exe изобщо не
        # тръгва: „ModuleNotFoundError: No module named
        # reportlab.graphics.barcode.code128" (точно това провали билда на
        # v3.29.0). Готовите hook-ове в pyinstaller-hooks-contrib покриват
        # само данните на reportlab (hook-reportlab.pdfbase._fontdata,
        # hook-reportlab.lib.utils), НЕ и тези скрити импорти.
        # Тесният флаг е достатъчен — по-широкият --collect-all reportlab
        # също работи, но прави .exe-то ~4 MB по-голямо без полза
        # (проверено с реален локален PyInstaller билд и на двата варианта).
        run: >
          pyinstaller --onefile --windowed --noupx --name PachoLogistic
          --version-file version_info.txt --icon assets\icon.ico
          --collect-all webview --collect-all clr_loader --collect-all pythonnet
          --collect-data certifi --collect-data babel
          --collect-submodules reportlab.graphics.barcode
          --add-data "templates;templates" --add-data "static;static"
          --add-data "translations;translations" --add-data "fonts;fonts" app.py

      - name: Smoke test the exe
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          ./dist/PachoLogistic.exe > exe_output.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/login | grep -q "PachoLogistic\|Вход"; then
              echo "Exe starts and serves the login page - OK"
              kill $APP_PID || true
              break
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "Exe process exited early. Output:"
              cat exe_output.log
              cat pacho_startup.log 2>/dev/null || true
              exit 1
            fi
            sleep 2
            if [ "$i" = "30" ]; then
              echo "Exe did not start correctly. Output:"
              cat exe_output.log
              cat pacho_startup.log 2>/dev/null || true
              kill $APP_PID || true
              exit 1
            fi
          done
          rm -f pacho_startup.log
          rm -f pacho_logistic.db .secret_key pacho_config.json

      - name: Install Inno Setup
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DMyAppVersion=${{ steps.ver.outputs.version }}

      - name: Smoke test the installer
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: |
          dist_installer\PachoLogistic-Setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER
          if not exist "%LOCALAPPDATA%\Programs\PachoLogistic\PachoLogistic.exe" (
            echo Installer did not place the exe where expected
            exit /b 1
          )
          echo Installer OK - exe found in %LOCALAPPDATA%\Programs\PachoLogistic

      - name: Generate SHA256SUMS.txt
        # Публикуван манифест с контролни суми — updater.py го изтегля и
        # проверява срещу него свалената .exe ПРЕДИ да замести работещата
        # версия (виж updater.py: check_for_update/install_update), вместо
        # да разчита само на размер+MZ магически байтове.
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = @()
          $lines += (Get-FileHash dist\PachoLogistic.exe -Algorithm SHA256).Hash.ToLower() + "  PachoLogistic.exe"
          $lines += (Get-FileHash dist_installer\PachoLogistic-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  PachoLogistic-Setup.exe"
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ПачоЛогистик v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/PachoLogistic.exe
            dist_installer/PachoLogistic-Setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 🚚 ПачоЛогистик v${{ steps.ver.outputs.version }}

            **Препоръчано изтегляне — инсталатор** (Старт меню, икона на десктопа,
            деинсталатор в „Добавяне/премахване на програми“ — както всяка друга
            програма, без нужда от администраторски права):
            **PachoLogistic-Setup.exe**

            **Или самостоятелен .exe** (без инсталация — просто го стартирайте):
            **PachoLogistic.exe**

            Постоянни линкове към най-новата версия:
            - Инсталатор: https://github.com/${{ github.repository }}/releases/latest/download/PachoLogistic-Setup.exe
            - Самостоятелен .exe: https://github.com/${{ github.repository }}/releases/latest/download/PachoLogistic.exe

            При стартиране програмата отваря СВОЙ собствен прозорец (вграден
            WebView2) — не е нужен отделен браузър, работи като истинско
            настолно Windows приложение. (Обикновен браузър се ползва само
            като резервен вариант, ако WebView2 липсва на компютъра.)
            Първи вход: потребител `admin`, парола `admin123` (сменете я веднага).

            Инсталираните копия се обновяват автоматично — програмата сама открива
            новата версия и предлага „Обнови сега“ от таблото.

            ⚠ Приложението не е цифрово подписано (изисква платен сертификат на
            регистрирано юридическо лице). При първо стартиране Windows SmartScreen
            може да покаже предупреждение „Непознат издател“ — изберете
            „Още информация“ → „Стартирай въпреки това“. Това е нормално за нови
            малки приложения и намалява с времето.
