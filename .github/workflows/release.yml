# Автоматично компилиране на PHLogistics.exe (+ Windows инсталатор) и
# публикуване на релийз в GitHub. Задейства се при всяка промяна на
# version.py (т.е. при вдигане на версията).
# Версията е семантична: голяма.средна.малка (напр. 1.2.3).
name: Build and Release

on:
  push:
    branches: ["**"]
    paths:
      - "version.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          # ВАЖНО: 3.12, НЕ последната "стабилна" версия на Python.
          # Билдвахме с 3.14 преди (виж CHANGELOG v1.0.2) и това причини
          # повтарящата се грешка "Failed to load Python DLL ...
          # python314.dll ... LoadLibrary: The specified module could
          # not be found" при стартиране на готовото .exe при служители.
          # Това е известен, все още неразрешен проблем при PyInstaller
          # --onefile билдове с много нови версии на CPython (същият
          # клас грешка е докладван и в други PyInstaller проекти
          # веднага след издаване на нова главна версия на Python —
          # bootloader-ът на PyInstaller изостава в поддръжката).
          # 3.12 е дългогодишно, широко тествано с PyInstaller — при
          # нужда от по-нова версия, изчакай PyInstaller изрично да
          # обяви поддръжка за нея, преди да местиш това число.
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.version }} already exists - skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.exists.outputs.exists == 'false'
        # Одит (26.09.2026, находка №21): заключени версии — виж
        # constraints-release.txt.
        run: |
          pip install -r requirements.txt -c constraints-release.txt
          pip install pyinstaller==6.21.0 -c constraints-release.txt
          pip install "pytest>=8.0" -c constraints-release.txt

      - name: Run tests (hard gate)
        # Одит (16.08.2026, находка №28, дребна — частично): .github/
        # workflows/ci.yml вече пуска пълния тестов пакет (твърда бариера)
        # при ВСЕКИ push, но е ОТДЕЛЕН workflow, изпълняващ се ПАРАЛЕЛНО
        # с този — release.yml тук няма `needs:`/зависимост от ci.yml,
        # затова билд+публикуване на release МОГАТ да минат дори ако
        # тестовете в ci.yml се провалят точно на СЪЩИЯ push (двата
        # workflow-а не се изчакват един друг). Явна стъпка ТУК, ПРЕДИ
        # PyInstaller билда, затваря тази дупка директно в release.yml,
        # вместо да разчита на съвпадение по време с ci.yml. -m "not e2e"
        # (без Playwright/браузър на този Windows runner — по-бърз basic
        # safety net; пълният пакет с e2e вече тече в ci.yml при всеки push).
        #
        # timeout-minutes: предпазна мрежа срещу ЗАБИВАНЕ (не бавност) —
        # първото изпълнение на портала (run #79, v3.63.0) окачи целия
        # workflow за часове: тест, разчитащ pywebview да ЛИПСВА, на този
        # Windows runner (за разлика от Linux ci.yml) намираше пакета
        # инсталиран (sys_platform=="win32" маркер в requirements.txt) и
        # webview.start() отваряше истински WebView2 прозорец — GUI цикъл,
        # блокиращ вечно. Самият тест вече е поправен (виж
        # tests/test_desktop.py), но без таван тук всяко бъдещо подобно
        # забиване би висяло до 6-часовия глобален лимит на GitHub Actions.
        #
        # Одит (19.08.2026, находка №52, дребна): предишната стойност беше
        # 20 мин. с обосновка „многократен запас“ — усещане, не измерване, и
        # вече не е вярна. ИЗМЕРЕНО на 19.08.2026: пълният пакет `-m "not
        # e2e"` е 821 теста и минава за 4 мин. 27 сек. на Linux; Windows
        # runner-ите на GitHub са 2–4× по-бавни при същата работа (по-бавен
        # диск, антивирус, скъп process spawn — а пакетът пуска подпроцеси и
        # генерира PDF-и), тоест реално 9–18 мин. При 20 мин. таванът щеше
        # да започне да убива ЗДРАВИ билдове след още един-два кръга нови
        # тестове, при това с изход, който изглежда точно като истинско
        # забиване. 40 мин. връща запаса приблизително ×2 спрямо горната
        # граница на измереното, без да губи смисъла на предпазителя (при
        # блокиран GUI цикъл алтернативата е 6 часа).
        if: steps.exists.outputs.exists == 'false'
        timeout-minutes: 40
        run: python -m pytest -q -m "not e2e"

      - name: Stamp version into exe metadata
        # Обновява version_info.txt на всеки билд: версийния номер (FileVersion/
        # ProductVersion) И годината в LegalCopyright (COPYRIGHT_YEAR -> текущата
        # календарна година при билда) — виж version_info.txt за подробности.
        if: steps.exists.outputs.exists == 'false'
        shell: python
        run: |
          import datetime
          v = "${{ steps.ver.outputs.version }}"
          parts = (v.split(".") + ["0", "0", "0"])[:3] + ["0"]
          tuple_str = "(%s)" % ", ".join(parts)
          year = str(datetime.datetime.now(datetime.timezone.utc).year)
          with open("version_info.txt", "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("(0, 0, 0, 0)", tuple_str)
          content = content.replace("0.0.0.0", "%s.%s.%s.%s" % tuple(parts))
          content = content.replace("COPYRIGHT_YEAR", year)
          with open("version_info.txt", "w", encoding="utf-8") as f:
              f.write(content)

      - name: Build PHLogistics.exe
        if: steps.exists.outputs.exists == 'false'
        # --add-data "translations;translations": .mo каталозите на
        # многоезичния интерфейс (БГ/EN/TR, Flask-Babel). Без тях .exe-то
        # тръгва, но превключвателят на езика не прави нищо (gettext тихо
        # връща суровия msgid).
        # --additional-hooks-dir pyinstaller_hooks: Одит (01.10.2026, Q9) —
        # собственият hook-babel.py пакетира CLDR данните само за root/bg/en/tr
        # + global.dat (вграденият hook и --collect-data babel вземаха всичките
        # ~1080 локала, ~9.7 MB). Нов език → pyinstaller_hooks/hook-babel.py.
        # --add-data "fonts;fonts": DejaVu Sans шрифтовете за PDF износа
        # (pdf_export.py, бутон „Изтегли PDF“) — вижте fonts/README.md.
        # Без тях компилираният .exe пак генерира PDF (xhtml2pdf не гърми
        # при липсващ @font-face файл), но кирилицата в него излиза като
        # плътни черни правоъгълници вместо букви — същият клас "тихо
        # проваля се без грешка" проблем като Babel по-горе.
        #
        # --collect-submodules reportlab.graphics.barcode: ЗАДЪЛЖИТЕЛЕН за
        # PDF износа. reportlab зарежда баркод модулите си ДИНАМИЧНО, през
        # exec на сглобен низ (reportlab/graphics/barcode/widgets.py:
        # `code = 'from %s import %s' % (mod, codeName); rl_exec(code, ns)`),
        # затова статичният анализ на PyInstaller не ги вижда и не ги
        # пакетира. Веригата, по която ни засяга: pdf_export → xhtml2pdf.pisa
        # → …tags → reportlab.graphics.barcode.__init__._reset() → widgets.
        # Тъй като това се случва при ИМПОРТА, компилираният .exe изобщо не
        # тръгва: „ModuleNotFoundError: No module named
        # reportlab.graphics.barcode.code128" (точно това провали билда на
        # v3.29.0). Готовите hook-ове в pyinstaller-hooks-contrib покриват
        # само данните на reportlab (hook-reportlab.pdfbase._fontdata,
        # hook-reportlab.lib.utils), НЕ и тези скрити импорти.
        # Тесният флаг е достатъчен — по-широкият --collect-all reportlab
        # също работи, но прави .exe-то ~4 MB по-голямо без полза
        # (проверено с реален локален PyInstaller билд и на двата варианта).
        run: >
          pyinstaller --onefile --windowed --noupx --name PHLogistics
          --version-file version_info.txt --icon assets\icon.ico
          --collect-all webview --collect-all clr_loader --collect-all pythonnet
          --collect-data certifi --additional-hooks-dir pyinstaller_hooks
          --collect-submodules reportlab.graphics.barcode
          --add-data "templates;templates" --add-data "static;static"
          --add-data "translations;translations" --add-data "fonts;fonts" app.py

      - name: Smoke test the exe
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        # Одит (02.09.2026, десети одит, находка №10): без тази променлива
        # прясно компилираното .exe пуска НАСТОЯЩИЯ цикъл за автоматично
        # обновяване (is_frozen_windows() е True на windows-latest), пита
        # GitHub и при определени номера на версии подменя самото
        # dist\PHLogistics.exe — файлът, който следващите стъпки хешират и
        # публикуват. Подмяната я прави откачен cmd.exe, който преживява
        # `kill $APP_PID`. Виж updater.start_auto_update_loop.
        # Одит (07.10.2026): новото име на променливата (до v3.79 —
        # PACHO_DISABLE_AUTO_UPDATE, която програмата също още чете).
        env:
          PH_DISABLE_AUTO_UPDATE: "1"
        run: |
          # Одит (03.09.2026, находка №24): диагностиката гледа в dist\, не
          # в корена. Програмата пише лога, базата, тайния ключ и
          # конфигурацията ДО .EXE-ТО (app.py: _base_dir_early = dirname(
          # abspath(sys.executable)); същото за config.CONFIG_PATH и
          # db.BASE_DIR/SECRET_PATH), а тази стъпка се изпълнява в корена на
          # хранилището. Глобът за лога (тогава `pacho_startup*.log`) не съвпадаше с нищо
          # и беше заглушен с `|| true`, а `exe_output.log` е ГАРАНТИРАНО
          # празен: .exe-то е билднато с --windowed, значи sys.stdout/stderr
          # са None и целият изход отива именно в лог файла. Тоест при
          # провал на smoke теста се отпечатваше нищо — а точно този лог
          # обяснява защо .exe-то не тръгва (проектът вече е имал два такива
          # релийз провала).
          ./dist/PHLogistics.exe > exe_output.log 2>&1 &
          APP_PID=$!
          dump_diagnostics() {
            echo "--- exe_output.log ---"; cat exe_output.log 2>/dev/null || true
            echo "--- dist/ph_startup*.log ---"; cat dist/ph_startup*.log 2>/dev/null || true
            echo "--- dist listing ---"; ls -la dist/ 2>/dev/null || true
          }
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/login | grep -q "PH Logistics\|Вход"; then
              echo "Exe starts and serves the login page - OK"
              # Одит (01.10.2026, Q9): EN/TR интерфейсът работи с орязаните
              # babel данни (преведеният етикет на полето за потребител).
              for pair in "en:Username" "tr:Kullan"; do
                lang=${pair%%:*}; word=${pair#*:}
                if ! curl -sf "http://127.0.0.1:5000/login?lang=$lang" | grep -q "for=\"username\">$word"; then
                  echo "Login page in '$lang' failed"
                  dump_diagnostics
                  kill $APP_PID || true
                  exit 1
                fi
              done
              echo "EN/TR login pages - OK"
              kill $APP_PID || true
              break
            fi
            if ! kill -0 $APP_PID 2>/dev/null; then
              echo "Exe process exited early. Output:"
              dump_diagnostics
              exit 1
            fi
            sleep 2
            if [ "$i" = "30" ]; then
              echo "Exe did not start correctly. Output:"
              dump_diagnostics
              kill $APP_PID || true
              exit 1
            fi
          done
          rm -f exe_output.log
          rm -f dist/ph_startup*.log
          rm -f dist/ph_logistics.db dist/ph_logistics.db-wal dist/ph_logistics.db-shm
          rm -f dist/.secret_key dist/ph_config.json

      - name: Install Inno Setup
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DMyAppVersion=${{ steps.ver.outputs.version }}

      - name: Smoke test the installer
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: |
          dist_installer\PHLogistics-Setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER
          if not exist "%LOCALAPPDATA%\Programs\PHLogistics\PHLogistics.exe" (
            echo Installer did not place the exe where expected
            exit /b 1
          )
          echo Installer OK - exe found in %LOCALAPPDATA%\Programs\PHLogistics

      # Одит (06.10.2026): преходът PachoLogistic → PHLogistics на истински
      # Windows — твърда бариера ПРЕДИ публикуването (виж
      # scripts/ci_rename_migration_test.ps1 и legacy_migration.py). Два пътя:
      # стара инсталация + новият инсталатор, и бутонът „Завърши
      # преминаването“ (--complete-rename-with) от старото .exe.
      - name: Migration test - legacy install + new installer
        if: steps.exists.outputs.exists == 'false'
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/ci_rename_migration_test.ps1 -Scenario setup

      - name: Migration test - complete the rename from the old exe
        if: steps.exists.outputs.exists == 'false'
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/ci_rename_migration_test.ps1 -Scenario cli

      # Одит (07.10.2026): преносима инсталация (C:\phl_portable,
      # PachoLogistic.exe + данни със старите имена) — преименуване на място;
      # същата папка, споделена с New-SmbShare — нищо не се преименува.
      - name: Migration test - portable install renamed in place
        if: steps.exists.outputs.exists == 'false'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/ci_rename_migration_test.ps1 -Scenario portable

      - name: Migration test - shared portable folder is left alone
        if: steps.exists.outputs.exists == 'false'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/ci_rename_migration_test.ps1 -Scenario shared

      - name: Legacy download names
        # Одит (06.10.2026): клиентите до v3.78 търсят в релийза точно
        # PachoLogistic.exe (и реда му в SHA256SUMS.txt) — публикуваме копия
        # на СЪЩИТЕ файлове и под старите имена; старите постоянни линкове
        # също продължават да работят.
        # Одит (07.10.2026): копията (тази стъпка, двата реда в SHA256SUMS.txt
        # и двата файла в „Publish release“) могат да отпаднат едва когато
        # страницата „Система“ → „Компютри и версии“ 30 дни не показва
        # компютър под 3.79 на нито една инсталация — и показва ВСИЧКИ нейни
        # компютри (версиите до v3.79 не се отчитат там, затова липсващ
        # компютър значи „още стара версия“; виж docs/DEVELOPER.md, раздел 8),
        # а броячът на изтеглянията на PachoLogistic*.exe в последните
        # релийзи е спрял.
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item dist\PHLogistics.exe dist\PachoLogistic.exe
          Copy-Item dist_installer\PHLogistics-Setup.exe dist_installer\PachoLogistic-Setup.exe

      - name: Generate SHA256SUMS.txt
        # Публикуван манифест с контролни суми — updater.py го изтегля и
        # проверява срещу него свалената .exe ПРЕДИ да замести работещата
        # версия (виж updater.py: check_for_update/install_update), вместо
        # да разчита само на размер+MZ магически байтове.
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $lines = @()
          $lines += (Get-FileHash dist\PHLogistics.exe -Algorithm SHA256).Hash.ToLower() + "  PHLogistics.exe"
          $lines += (Get-FileHash dist_installer\PHLogistics-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  PHLogistics-Setup.exe"
          $lines += (Get-FileHash dist\PachoLogistic.exe -Algorithm SHA256).Hash.ToLower() + "  PachoLogistic.exe"
          $lines += (Get-FileHash dist_installer\PachoLogistic-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  PachoLogistic-Setup.exe"
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish release
        if: steps.exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PH Logistics v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/PHLogistics.exe
            dist_installer/PHLogistics-Setup.exe
            dist/PachoLogistic.exe
            dist_installer/PachoLogistic-Setup.exe
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 🚚 PH Logistics v${{ steps.ver.outputs.version }}

            **Препоръчано изтегляне — инсталатор** (Старт меню, икона на десктопа,
            деинсталатор в „Добавяне/премахване на програми“ — както всяка друга
            програма, без нужда от администраторски права):
            **PHLogistics-Setup.exe**

            **Или самостоятелен .exe** (без инсталация — просто го стартирайте):
            **PHLogistics.exe**

            Постоянни линкове към най-новата версия:
            - Инсталатор: https://github.com/${{ github.repository }}/releases/latest/download/PHLogistics-Setup.exe
            - Самостоятелен .exe: https://github.com/${{ github.repository }}/releases/latest/download/PHLogistics.exe

            Новите имена на файловете (PHLogistics…) заменят старите (PachoLogistic…).
            Старите линкове продължават да работят — `PachoLogistic.exe` и
            `PachoLogistic-Setup.exe` са копия на същите файлове (за автоматичното
            обновяване на по-старите версии). Локалната инсталация се премества
            сама в папка PHLogistics; мрежовите/преносимите инсталации запазват
            старите имена на файловете.

            При стартиране програмата отваря СВОЙ собствен прозорец (вграден
            WebView2) — не е нужен отделен браузър, работи като истинско
            настолно Windows приложение. (Обикновен браузър се ползва само
            като резервен вариант, ако WebView2 липсва на компютъра.)
            Първи вход: потребител `admin`, парола `admin123` (сменете я веднага).

            Инсталираните копия се обновяват автоматично — програмата сама открива
            новата версия и предлага „Обнови сега“ от таблото.

            ⚠ Приложението не е цифрово подписано (изисква платен сертификат на
            регистрирано юридическо лице). При първо стартиране Windows SmartScreen
            може да покаже предупреждение „Непознат издател“ — изберете
            „Още информация“ → „Стартирай въпреки това“. Това е нормално за нови
            малки приложения и намалява с времето.

      - name: VirusTotal scan
        # Качва изданието във VirusTotal и добавя резултата и линка към доклада
        # в описанието на изданието. Нужен е secret VT_API_KEY (безплатен ключ
        # от virustotal.com); без него стъпката само съобщава, че е пропусната.
        # Никога не проваля изданието — то вече е публикувано.
        if: steps.exists.outputs.exists == 'false'
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body > release_body.md
          python scripts/virustotal_scan.py --summary vt_summary.md --body-file release_body.md \
            dist/PHLogistics.exe dist_installer/PHLogistics-Setup.exe
          if [ -s vt_summary.md ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file release_body.md
          fi
