# ВРЕМЕНЕН (06.10.2026): бърза диагностика на сценария „Завърши
# преминаването“ на истински Windows — само билд + този сценарий, без
# тестовете и без публикуване. Ще бъде изтрит след диагностиката.
name: Debug rename (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # ВАЖНО: 3.12, НЕ последната "стабилна" версия на Python.
          # Билдвахме с 3.14 преди (виж CHANGELOG v1.0.2) и това причини
          # повтарящата се грешка "Failed to load Python DLL ...
          # python314.dll ... LoadLibrary: The specified module could
          # not be found" при стартиране на готовото .exe при служители.
          # Това е известен, все още неразрешен проблем при PyInstaller
          # --onefile билдове с много нови версии на CPython (същият
          # клас грешка е докладван и в други PyInstaller проекти
          # веднага след издаване на нова главна версия на Python —
          # bootloader-ът на PyInstaller изостава в поддръжката).
          # 3.12 е дългогодишно, широко тествано с PyInstaller — при
          # нужда от по-нова версия, изчакай PyInstaller изрично да
          # обяви поддръжка за нея, преди да местиш това число.
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.ver.outputs.version }} already exists - skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.exists.outputs.exists == 'false'
        # Одит (26.09.2026, находка №21): заключени версии — виж
        # constraints-release.txt.
        run: |
          pip install -r requirements.txt -c constraints-release.txt
          pip install pyinstaller==6.21.0 -c constraints-release.txt
          pip install "pytest>=8.0" -c constraints-release.txt

      - name: Stamp version into exe metadata
        # Обновява version_info.txt на всеки билд: версийния номер (FileVersion/
        # ProductVersion) И годината в LegalCopyright (COPYRIGHT_YEAR -> текущата
        # календарна година при билда) — виж version_info.txt за подробности.
        if: steps.exists.outputs.exists == 'false'
        shell: python
        run: |
          import datetime
          v = "${{ steps.ver.outputs.version }}"
          parts = (v.split(".") + ["0", "0", "0"])[:3] + ["0"]
          tuple_str = "(%s)" % ", ".join(parts)
          year = str(datetime.datetime.now(datetime.timezone.utc).year)
          with open("version_info.txt", "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("(0, 0, 0, 0)", tuple_str)
          content = content.replace("0.0.0.0", "%s.%s.%s.%s" % tuple(parts))
          content = content.replace("COPYRIGHT_YEAR", year)
          with open("version_info.txt", "w", encoding="utf-8") as f:
              f.write(content)

      - name: Build PHLogistics.exe
        if: steps.exists.outputs.exists == 'false'
        # --add-data "translations;translations": .mo каталозите на
        # многоезичния интерфейс (БГ/EN/TR, Flask-Babel). Без тях .exe-то
        # тръгва, но превключвателят на езика не прави нищо (gettext тихо
        # връща суровия msgid).
        # --additional-hooks-dir pyinstaller_hooks: Одит (01.10.2026, Q9) —
        # собственият hook-babel.py пакетира CLDR данните само за root/bg/en/tr
        # + global.dat (вграденият hook и --collect-data babel вземаха всичките
        # ~1080 локала, ~9.7 MB). Нов език → pyinstaller_hooks/hook-babel.py.
        # --add-data "fonts;fonts": DejaVu Sans шрифтовете за PDF износа
        # (pdf_export.py, бутон „Изтегли PDF“) — вижте fonts/README.md.
        # Без тях компилираният .exe пак генерира PDF (xhtml2pdf не гърми
        # при липсващ @font-face файл), но кирилицата в него излиза като
        # плътни черни правоъгълници вместо букви — същият клас "тихо
        # проваля се без грешка" проблем като Babel по-горе.
        #
        # --collect-submodules reportlab.graphics.barcode: ЗАДЪЛЖИТЕЛЕН за
        # PDF износа. reportlab зарежда баркод модулите си ДИНАМИЧНО, през
        # exec на сглобен низ (reportlab/graphics/barcode/widgets.py:
        # `code = 'from %s import %s' % (mod, codeName); rl_exec(code, ns)`),
        # затова статичният анализ на PyInstaller не ги вижда и не ги
        # пакетира. Веригата, по която ни засяга: pdf_export → xhtml2pdf.pisa
        # → …tags → reportlab.graphics.barcode.__init__._reset() → widgets.
        # Тъй като това се случва при ИМПОРТА, компилираният .exe изобщо не
        # тръгва: „ModuleNotFoundError: No module named
        # reportlab.graphics.barcode.code128" (точно това провали билда на
        # v3.29.0). Готовите hook-ове в pyinstaller-hooks-contrib покриват
        # само данните на reportlab (hook-reportlab.pdfbase._fontdata,
        # hook-reportlab.lib.utils), НЕ и тези скрити импорти.
        # Тесният флаг е достатъчен — по-широкият --collect-all reportlab
        # също работи, но прави .exe-то ~4 MB по-голямо без полза
        # (проверено с реален локален PyInstaller билд и на двата варианта).
        run: >
          pyinstaller --onefile --windowed --noupx --name PHLogistics
          --version-file version_info.txt --icon assets\icon.ico
          --collect-all webview --collect-all clr_loader --collect-all pythonnet
          --collect-data certifi --additional-hooks-dir pyinstaller_hooks
          --collect-submodules reportlab.graphics.barcode
          --add-data "templates;templates" --add-data "static;static"
          --add-data "translations;translations" --add-data "fonts;fonts" app.py

      - name: Install Inno Setup
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        if: steps.exists.outputs.exists == 'false'
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss /DMyAppVersion=${{ steps.ver.outputs.version }}

      - name: Migration test - complete the rename from the old exe
        if: steps.exists.outputs.exists == 'false'
        timeout-minutes: 15
        shell: pwsh
        run: ./scripts/ci_rename_migration_test.ps1 -Scenario cli
