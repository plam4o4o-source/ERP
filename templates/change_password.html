{% extends "base.html" %}
{% block title %}Смяна на парола — {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="login-wrap" style="margin-top:30px">
  <h1>Смяна на парола</h1>
  <div class="card">
    <form method="post">
      <label>Текуща парола</label>
      <input type="password" name="current" required autocomplete="current-password">
      <label>Нова парола</label>
      <input type="password" name="new" required autocomplete="new-password">
      <label>Повторете новата парола</label>
      <input type="password" name="repeat" required autocomplete="new-password">
      <div class="actions">
        <button type="submit">Смени паролата</button>
        <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Отказ</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
