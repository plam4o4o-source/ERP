[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# -m "not e2e": по подразбиране (в основния `pytest` твърд CI гейт) НЕ
# тръгват end-to-end тестовете (tests/test_e2e_smoke.py) — те карат
# истински headless браузър (Playwright/Chromium) срещу истински работещ
# сървър и изискват изтеглен браузър, който не е нужен/наличен в бързия
# основен CI job (виж .github/workflows/ci.yml, нов job "e2e", който ги
# пуска изрично с `pytest -m e2e`).
# Одит (12.08.2026, находка №35): --strict-markers — единственият маркер
# в проекта е "e2e" (виж по-долу), но без strict режим бъдеща печатна
# грешка в @pytest.mark.xyz (напр. неволно "eze" вместо "e2e") би се
# приела тихо от pytest вместо да гръмне ясно при collection.
addopts = -ra -q -m "not e2e" --strict-markers
markers =
    e2e: end-to-end тестове с истински браузър (Playwright) срещу истински работещ сървър — бавни, изключени по подразбиране
